# ─────────────────────────────────────────────────────────────────────────────
#  systemd service unit — scheduler (data harvesting)
#  Save as:  /etc/systemd/system/mfg-scheduler.service
# ─────────────────────────────────────────────────────────────────────────────
[Unit]
Description=Manufacturing Dashboard – Historian Scheduler
After=network.target

[Service]
Type=simple
User=dashboarduser
WorkingDirectory=/opt/manufacturing_dashboard
ExecStart=/opt/manufacturing_dashboard/venv/bin/python scheduler.py
Restart=always
RestartSec=10
StandardOutput=journal
StandardError=journal

# Optional: pass secrets via environment (avoids storing them in config.yaml)
# EnvironmentFile=/etc/manufacturing_dashboard/secrets.env

[Install]
WantedBy=multi-user.target


